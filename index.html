<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="announcement-bar">
        <span>Financing options available at checkout.</span>
      </div>
      <div class="container">
        <div class="header__title">
          <img src="img/logo_header.svg" alt="logo" />
        </div>
        <div class="header__nav">
          <a href="#">Electric Skateboards</a>
          <a href="#">Electric Scooters</a>
          <a href="#">Accessories</a>
          <a href="#">Gift Card</a>
          <a href="#">More Info</a>
        </div>
        <div class="header__actions">
          <div class="frame">
            <img src="img/frame.svg" alt="Account" />
          </div>

          <div class="cart">
            <img src="img/cart.svg" alt="Cart" />
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__content">
            <h1 class="hero__title">Welcome to Boosted USA</h1>
            <p>
              The Holy Grail of Electric Skateboards and One REVolutionary
              Scooter
            </p>

            <div class="hero__buttons">
              <a href="#" class="hero__button">BOOSTED REVS</a>
              <a href="#" class="hero__button">BOOSTED BOARDS</a>
            </div>
          </div>
        </div>
      </section>
      <section class="partners">
        <div class="black__line">
            <img src="img/electrek.svg" alt="Electrek" />
            <img src="img/tech_crunch.svg" alt="TechCrunch" />
            <img src="img/popular_mechanics.svg" alt="Popular Mechanics" />
            <img src="img/wired.svg" alt="wired" />
        </div>
      </section>

    </main>
  </body>
</html>
